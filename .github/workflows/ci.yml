name: CIAI CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Reject generated output and private material
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(bin|obj|target|\.vs|\.idea|logs)/'; then
            echo "Generated or IDE output is tracked."
            exit 1
          fi
          if git ls-files | grep -Ei '\.(pfx|p12|jks|keystore|key|pem|cer|crt|dll|exe)$'; then
            echo "Certificate, private key, vendor binary, or executable is tracked."
            exit 1
          fi
      - name: Install contract validators
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-validation.txt
      - name: Validate schemas, OpenAPI and published YAML
        run: python scripts/validate_contracts.py
      - name: Validate driver migration skill
        run: python .agents/skills/device-driver-migration/scripts/validate_skill.py

  dotnet-contract:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore CiaiControllerSDK.ContractTests/CiaiControllerSDK.ContractTests.csproj
      - run: dotnet build CiaiControllerSDK/CiaiControllerSDK.csproj -c Release --no-restore -warnaserror
      - run: dotnet run --project CiaiControllerSDK.ContractTests/CiaiControllerSDK.ContractTests.csproj -c Release --no-restore
      - run: dotnet build examples/csharp-temperature/Ciai.Example.Temperature.csproj -c Release
      - run: dotnet pack CiaiControllerSDK/CiaiControllerSDK.csproj -c Release --no-build --output artifacts
      - run: dotnet pack CiaiControllerSDK.LegacyAdapter/CiaiControllerSDK.LegacyAdapter.csproj -c Release --output artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: dotnet-packages
          path: artifacts/*.*nupkg

  java-contract:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ["8", "11"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: .\mvnw.cmd --batch-mode --no-transfer-progress install
      - name: Validate configuration from an arbitrary working directory
        shell: pwsh
        run: |
          $repository = $env:GITHUB_WORKSPACE
          Push-Location $env:RUNNER_TEMP
          try {
            & "$repository\mvnw.cmd" --batch-mode --no-transfer-progress `
              -f "$repository\examples\java-temperature\pom.xml" exec:java `
              "-Dexec.args=--validate --config $repository\examples\java-temperature\src\main\resources\application.yml"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }
      - name: Verify Java package contents
        shell: pwsh
        run: |
          $jar = Get-ChildItem CiaiControllerSDKForJava/target/ciai-controller-sdk-*.jar |
            Where-Object Name -NotMatch '-(sources|javadoc)\.jar$' |
            Select-Object -First 1
          $contents = & jar tf $jar.FullName
          $required = @(
            'com/ciai/controller/sdk/webserver/DriverCli.class',
            'com/ciai/controller/sdk/config/ConfigurationValidationReport.class',
            'com/ciai/controller/sdk/service/OwnedSemaphore.class',
            'META-INF/ciai/openapi/ciai-2.0.yaml',
            'META-INF/ciai/schemas/application.schema.json'
          )
          foreach ($entry in $required) {
            if ($contents -notcontains $entry) { throw "Missing JAR entry: $entry" }
          }
      - uses: actions/upload-artifact@v7
        with:
          name: java-packages-jdk-${{ matrix.java }}
          path: |
            CiaiControllerSDKForJava/target/*.jar
            !CiaiControllerSDKForJava/target/original-*.jar
